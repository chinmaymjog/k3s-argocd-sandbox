# Optional group: identity (Keycloak).
# Not synced automatically. Apply when you want this group:
#   kubectl apply -f argocd/optional/identity.yaml
# If you're running from a fork, edit repoURL/targetRevision below to match
# what's in your own .env first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-apps-identity
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/chinmaymjog/k3s-argocd-sandbox.git'
    targetRevision: main
    path: apps/optional/identity
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
