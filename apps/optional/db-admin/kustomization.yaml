apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Optional group: db-admin (MySQL, Adminer, phpMyAdmin). Bundled together
# because phpMyAdmin needs MySQL running.
# Applied by a separate ArgoCD Application - see argocd/optional/db-admin.yaml
# and "Optional Stack Groups" in the README. Not synced by the core
# sandbox-apps Application.
resources:
  - adminer.yaml
  - mysql.yaml
  - phpmyadmin.yaml
configMapGenerator:
  - name: sandbox-runtime
    envs:
      - runtime.env
  - name: sandbox-images
    envs:
      - images.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.ADMINER_HOST
    targets:
      - select:
          kind: Ingress
          name: adminer
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.PHPMYADMIN_HOST
    targets:
      - select:
          kind: Ingress
          name: phpmyadmin
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.ADMINER_IMAGE
    targets:
      - select:
          kind: Deployment
          name: adminer
        fieldPaths:
          - spec.template.spec.containers.[name=adminer].image
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.MYSQL_IMAGE
    targets:
      - select:
          kind: Deployment
          name: mysql
        fieldPaths:
          - spec.template.spec.containers.[name=mysql].image
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.PHPMYADMIN_IMAGE
    targets:
      - select:
          kind: Deployment
          name: phpmyadmin
        fieldPaths:
          - spec.template.spec.containers.[name=phpmyadmin].image
