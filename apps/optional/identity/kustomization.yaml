apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Optional group: identity (Keycloak).
# Applied by a separate ArgoCD Application - see argocd/optional/identity.yaml
# and "Optional Stack Groups" in the README. Not synced by the core
# sandbox-apps Application.
resources:
  - keycloak.yaml
configMapGenerator:
  - name: sandbox-runtime
    envs:
      - runtime.env
  - name: sandbox-images
    envs:
      - images.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.KEYCLOAK_HOST
    targets:
      - select:
          kind: Deployment
          name: keycloak
        fieldPaths:
          - spec.template.spec.containers.[name=keycloak].env.[name=KC_HOSTNAME].value
      - select:
          kind: Ingress
          name: keycloak
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.KEYCLOAK_IMAGE
    targets:
      - select:
          kind: Deployment
          name: keycloak
        fieldPaths:
          - spec.template.spec.containers.[name=keycloak].image
