apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This is the CORE app set - good to get started, always synced by the
# sandbox-apps Application. Optional groups (Keycloak, MySQL/Adminer/
# phpMyAdmin) live under apps/optional/<group>/ and are opt-in - see
# "Optional Stack Groups" in the README.
#
# This base reads the generated runtime and image mirrors.
# Edit .env, then run make configure.
# App flow:
# 1. add or update manifests in apps/<name>/
# 2. map any host/image values here
# 3. let ArgoCD sync the tree
resources:
  - cert-manager/issuer.yaml
  - grafana/grafana.yaml
  - n8n/n8n.yaml
  - pgsql/pgsql.yaml
  - prometheus/prometheus.yaml
configMapGenerator:
  - name: sandbox-runtime
    envs:
      - runtime.env
  - name: sandbox-images
    envs:
      - images.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.GRAFANA_HOST
    targets:
      - select:
          kind: Ingress
          name: grafana
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.N8N_HOST
    targets:
      - select:
          kind: Deployment
          name: n8n
        fieldPaths:
          - spec.template.spec.containers.[name=n8n].env.[name=N8N_HOST].value
      - select:
          kind: Ingress
          name: n8n
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.N8N_WEBHOOK_URL
    targets:
      - select:
          kind: Deployment
          name: n8n
        fieldPaths:
          - spec.template.spec.containers.[name=n8n].env.[name=WEBHOOK_URL].value
  - source:
      kind: ConfigMap
      name: sandbox-runtime
      fieldPath: data.PROMETHEUS_HOST
    targets:
      - select:
          kind: Ingress
          name: prometheus
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.GRAFANA_IMAGE
    targets:
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.[name=grafana].image
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.N8N_IMAGE
    targets:
      - select:
          kind: Deployment
          name: n8n
        fieldPaths:
          - spec.template.spec.containers.[name=n8n].image
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.PGSQL_IMAGE
    targets:
      - select:
          kind: Deployment
          name: pgsql
        fieldPaths:
          - spec.template.spec.containers.[name=postgres].image
  - source:
      kind: ConfigMap
      name: sandbox-images
      fieldPath: data.PROMETHEUS_IMAGE
    targets:
      - select:
          kind: Deployment
          name: prometheus
        fieldPaths:
          - spec.template.spec.containers.[name=prometheus].image
